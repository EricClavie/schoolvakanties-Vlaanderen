name: Update Vlaamse schoolvakanties

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_schoolvakanties.py'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update ICS from Vlaanderen.be
        run: python update_schoolvakanties.py

      - name: Commit changed calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schoolvakanties_vlaanderen_2026-2030.ics
          if git diff --cached --quiet; then
            echo 'No calendar changes.'
          else
            git commit -m 'Update Vlaamse schoolvakanties'
            git push
          fi
